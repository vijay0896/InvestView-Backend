server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: invest-view-backend

  config:
    import: optional:file:.env[.properties]

  # MySQL Connection Pool (HikariCP)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  # Spring Data JPA / Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update} # Development mode me entities se table auto-sync karega
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

# Spring Boot Actuator Health Endpoint
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Application Custom Properties
app:
  jwt:
    # Minimum 32 characters required for HS256 cryptographic security
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours (in milliseconds)
